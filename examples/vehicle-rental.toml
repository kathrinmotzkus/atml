# Vehicle rental -- the SAME fleet as vehicle-rental.atml, in plain TOML,
# written as one would author it without ATML: no inheritance (every vehicle
# repeats all class and drive values), no enums (plain strings), units in
# trailing comments. This is the redundancy ATML removes.

[[vehicle]]
id                 = "CE-01"
location           = "Berlin"
status             = "available"
currency           = "EUR"
min_rental_period  = 1             # days
wheels             = 4
seats              = 5
licence_class      = "B"
cargo_volume       = 0.5           # m^3
deposit            = 250           # EUR
base_rate          = 49            # EUR
drive_type         = "Electric"
energy_source      = "electricity"
environmental_class= "A"
