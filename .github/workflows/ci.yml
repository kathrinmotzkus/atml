name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install abnf
      - name: Verify vendored baseline is byte-identical to upstream 1.1.0
        run: |
          curl -sL https://raw.githubusercontent.com/toml-lang/toml/1.1.0/toml.abnf -o /tmp/upstream.abnf
          diff -q /tmp/upstream.abnf grammar/toml-1.1.0.abnf
      - name: Build grammar (enforces additivity invariant)
        run: python tools/build_atml.py
      - name: Verify committed atml.abnf is in sync with sources
        run: git diff --exit-code grammar/atml.abnf
      - name: Run grammar test suite
        run: python tests/test_grammar.py

  ide-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ide-extensions
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  ide-fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ide-extensions
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-25
      - name: Install pinned cargo-fuzz
        run: cargo +1.94.1 install cargo-fuzz --version 0.13.1 --locked
      - name: Fuzz analysis smoke test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cargo +nightly-2026-05-25 fuzz run analyze -- -max_total_time=10 -max_len=65536
      - name: Fuzz language features smoke test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cargo +nightly-2026-05-25 fuzz run language_features -- -max_total_time=10 -max_len=16384

  ide-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ide-extensions/vscode-atml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/ide-extensions/vscode-atml/package-lock.json
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check and compile
        run: npm run check && npm run compile
      - name: Test TextMate grammar
        run: npm run test:grammar
      - name: Test VS Code activation and diagnostics
        run: xvfb-run -a npm run test:vscode

  ide-release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            server: atml-language-server
            glibc: "2.28"
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            vsce_target: linux-arm64
            server: atml-language-server
            glibc: "2.28"
          - os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            server: atml-language-server.exe
            glibc: ""
          - os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            vsce_target: win32-arm64
            server: atml-language-server.exe
            glibc: ""
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            vsce_target: darwin-x64
            server: atml-language-server
            glibc: ""
          - os: macos-15
            rust_target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            server: atml-language-server
            glibc: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/ide-extensions/vscode-atml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/ide-extensions/vscode-atml/package-lock.json
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.rust_target }}
      - name: Set up Python for the pinned Zig toolchain
        if: matrix.glibc != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned glibc-compatible linker
        if: matrix.glibc != ''
        shell: bash
        run: |
          python -m pip install ziglang==0.14.1
          cargo +1.94.1 install cargo-zigbuild --version 0.23.0 --locked
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build locked native language server
        if: matrix.glibc == ''
        working-directory: tools/ide-extensions
        run: cargo build --locked --release --target ${{ matrix.rust_target }} -p atml-language-server
      - name: Build glibc-compatible native language server
        if: matrix.glibc != ''
        working-directory: tools/ide-extensions
        run: cargo zigbuild --locked --release --target ${{ matrix.rust_target }}.${{ matrix.glibc }} -p atml-language-server
      - name: Verify minimum glibc version
        if: matrix.glibc != ''
        shell: bash
        run: ./scripts/verify-glibc.sh ../target/${{ matrix.rust_target }}/release/${{ matrix.server }} ${{ matrix.glibc }}
      - name: Package target-specific VSIX and checksum
        shell: bash
        run: ./scripts/package.sh ${{ matrix.vsce_target }} ../target/${{ matrix.rust_target }}/release/${{ matrix.server }}
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: atml-0.1.0-${{ matrix.vsce_target }}
          path: |
            tools/ide-extensions/vscode-atml/dist/*.vsix
            tools/ide-extensions/vscode-atml/dist/*.sha256
          if-no-files-found: error
